<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="stylesheet" href="../css/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listado de Incidencias</title>
</head>
<body>
    <header>
        <h1>Listado de Incidencias</h1>
        <nav aria-label="Navegación principal">
            <ul>
                <li><a href="dashboard.html">Panel de Control</a></li>
                <li><a href="listado.html" aria-current="page">Ver Incidencias</a></li>
                <li><a href="alta.html">Nueva Incidencia</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section aria-labelledby="tabla-title">
            <h2 id="tabla-title">Incidencias Activas</h2>
            <table>
                <thead>
                    <tr>
                        <th scope="col">ID</th>
                        <th scope="col">Título</th>
                        <th scope="col">Estado</th>
                        <th scope="col">Prioridad</th>
                        <th scope="col">Acciones</th>
                    </tr>
                </thead>
                <tbody id="tabla-incidencias-body">
                </tbody>
            </table>
        </section>
    </main>

    <script src="../js/listado_dinamico.js"></script>
</body>
</html>
