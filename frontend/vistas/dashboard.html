<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard - Sistema de Incidencias</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/design_system.css">
</head>
<body style="background-color: #f4f6f9; font-family: Arial, sans-serif; margin: 0;">

    <header style="background-color: #0056b3; padding: 20px; display: flex; justify-content: space-between; align-items: center; color: white;">
        <div style="font-size: 24px; font-weight: bold;">Panel de Control</div>
        <nav style="display: flex; gap: 20px;">
            <a href="alta.html" style="color: white; text-decoration: none; font-weight: bold;">Nueva Incidencia</a>
            <a href="listado.html" style="color: white; text-decoration: none; font-weight: bold;">Ver Incidencias</a>
            <a href="login.html" style="color: white; text-decoration: none; font-weight: bold;">Cerrar Sesión</a>
        </nav>
    </header>

    <div style="padding: 20px;">
        
        <div id="stats-container" class="dashboard-grid">
        </div>

        <h2 style="color: #333; margin-top: 20px;">Incidencias Recientes</h2>
        
        <!-- Contenedor para la tabla -->
        <table class="ui-table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Título</th>
                    <th>Estado</th>
                    <th>Prioridad</th>
                </tr>
            </thead>
            <tbody id="tabla-recientes">
            </tbody>
        </table>
    </div>

    <script src="../js/componentes.js"></script>
    <script src="../js/dashboard.js"></script>
</body>
</html>
