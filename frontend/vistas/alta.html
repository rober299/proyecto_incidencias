<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="stylesheet" href="../css/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nueva Incidencia</title>
    <style>
        .error-msg { color: var(--danger-color); font-size: 0.85rem; display: none; margin-top: 5px; }
        .input-error { border: 2px solid var(--danger-color) !important; }
        .success-panel { background-color: #d4edda; color: #155724; padding: 1rem; border-radius: 6px; margin-bottom: 1rem; display: none; }
    </style>
</head>
<body>
    <header>
        <h1>Registrar Nueva Incidencia</h1>
        <nav aria-label="Navegación principal">
            <ul>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="listado.html">Ver Incidencias</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section aria-labelledby="form-title">
            <h2 id="form-title">Formulario de Alta</h2>
            
            <div id="panel-exito" class="success-panel">
                ¡Incidencia registrada correctamente! Redirigiendo...
            </div>

            <form id="form-alta" action="listado.html" method="POST" novalidate>
                <div>
                    <label for="incidencia-titulo">Título breve:</label>
                    <input type="text" id="incidencia-titulo" name="titulo">
                    <span id="error-titulo" class="error-msg"></span>
                </div>
                
                <div>
                    <label for="incidencia-categoria">Categoría:</label>
                    <select id="incidencia-categoria" name="categoria">
                        <option value="">-- Selecciona una categoría --</option>
                        <option value="hardware">Hardware</option>
                        <option value="software">Software</option>
                        <option value="redes">Redes</option>
                    </select>
                    <span id="error-categoria" class="error-msg"></span>
                </div>

                <div>
                    <label for="incidencia-desc">Descripción detallada:</label>
                    <textarea id="incidencia-desc" name="descripcion" rows="5"></textarea>
                    <span id="error-desc" class="error-msg"></span>
                </div>

                <button type="submit">Crear Ticket</button>
            </form>
        </section>
    </main>

    <script src="../js/validaciones.js"></script>
</body>
</html>
