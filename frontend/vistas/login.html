<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="stylesheet" href="../css/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Incidencias</title>
</head>
<body>
    <header>
        <h1>Gestión de Incidencias Técnicas</h1>
    </header>

    <main>
        <section aria-labelledby="login-title">
            <h2 id="login-title">Acceso de Usuarios</h2>
            <form action="dashboard.html" method="POST">
                <div>
                    <label for="user-email">Correo Electrónico:</label>
                    <input type="email" id="user-email" name="email" required placeholder="ejemplo@empresa.com">
                </div>
                <div>
                    <label for="user-password">Contraseña:</label>
                    <input type="password" id="user-password" name="password" required>
                </div>
                <button type="submit">Iniciar Sesión</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Robert Chislea - Departamento de Soporte IT</p>
    </footer>
</body>
</html>
