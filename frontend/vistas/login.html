<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="stylesheet" href="../css/style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Sistema de Incidencias</title>
    <style>
        .error-msg { color: var(--danger-color); font-size: 0.85rem; display: none; margin-top: 5px; }
        .input-error { border: 2px solid var(--danger-color) !important; }
    </style>
</head>
<body>
    <header>
        <h1>Gestión de Incidencias Técnicas</h1>
    </header>

    <main>
        <section aria-labelledby="login-title">
            <h2 id="login-title">Acceso de Usuarios</h2>
            <form id="form-login" action="dashboard.html" method="POST" novalidate>
                <div>
                    <label for="user-email">Correo Electrónico:</label>
                    <input type="email" id="user-email" name="email" placeholder="ejemplo@empresa.com">
                    <span id="error-email" class="error-msg"></span>
                </div>
                <div>
                    <label for="user-password">Contraseña:</label>
                    <input type="password" id="user-password" name="password">
                    <span id="error-password" class="error-msg"></span>
                </div>
                <button type="submit">Iniciar Sesión</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Robert Chislea - Departamento de Soporte IT</p>
    </footer>

    <script src="../js/validaciones.js"></script>
</body>
</html>
